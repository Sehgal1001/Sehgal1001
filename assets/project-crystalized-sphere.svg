<rect x="216" y="260" width="140" height="38" rx="19" fill="#101d37" stroke="#8b5cff" stroke-width="1.8"/><text x="286" y="285" text-anchor="middle" fill="#f4f8ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1">PARTICLES</text>
<rect x="372" y="260" width="140" height="38" rx="19" fill="#101d37" stroke="#00e5cf" stroke-width="1.8"/><text x="442" y="285" text-anchor="middle" fill="#f4f8ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1">VISUAL FX</text>
<rect x="60" y="340" width="310" height="58" rx="18" fill="url(#bar)"/><text x="215" y="377" text-anchor="middle" fill="#081326" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900">OPEN LIVE DEMO</text><text x="930" y="375" text-anchor="end" fill="#00e5cf" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" letter-spacing="3">BUILD • CREATE • INNOVATE</text>
