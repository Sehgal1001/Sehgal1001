<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Crystalized Ball Interactive Particle Sphere project card">
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111d35"/><stop offset="1" stop-color="#0b1428"/></linearGradient>
 <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#20e6cf"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20e6cf"/><stop offset=".55" stop-color="#8b5cff"/><stop offset="1" stop-color="#20e6cf"/></linearGradient>
 <radialGradient id="orb" cx="35%" cy="28%"><stop stop-color="#d8ffff"/><stop offset=".18" stop-color="#9df9ff"/><stop offset=".55" stop-color="#00d9ff"/><stop offset=".8" stop-color="#7e4dff"/><stop offset="1" stop-color="#162a52"/></radialGradient>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#00e5cf" opacity=".65"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/><feOffset dy="13"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="440" rx="22" fill="#0b1222"/><rect width="1000" height="440" rx="22" fill="url(#dots)"/>
<circle cx="930" cy="18" r="138" fill="#8b5cff" opacity=".08"/><circle cx="10" cy="425" r="130" fill="#00e5cf" opacity=".07"/>
<g filter="url(#shadow)"><rect x="28" y="24" width="944" height="390" rx="28" fill="url(#panel)" stroke="url(#edge)" stroke-width="3"/><path d="M56 24 H944 Q972 24 972 52 V73 H28 V52 Q28 24 56 24Z" fill="url(#bar)"/></g>
<text x="70" y="57" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="1.3">PROJECT 12</text><text x="930" y="57" text-anchor="end" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" letter-spacing="1">ANIKET SAHGAL</text>
<rect x="76" y="112" width="174" height="126" rx="22" fill="#00e5cf" opacity=".12" stroke="#00e5cf" stroke-opacity=".8" stroke-width="2"/>
<g filter="url(#glow)"><circle cx="163" cy="175" r="47" fill="url(#orb)" opacity=".45"/><circle cx="163" cy="175" r="42" fill="none" stroke="#baffff" stroke-width="3" opacity=".85"/><circle cx="163" cy="175" r="34" fill="none" stroke="#00e5cf" stroke-width="2" stroke-dasharray="2 6"/><circle cx="163" cy="175" r="27" fill="none" stroke="#8b5cff" stroke-width="2" stroke-dasharray="4 5"/>
<g fill="#cfffff"><circle cx="126" cy="151" r="3"/><circle cx="141" cy="138" r="2.8"/><circle cx="167" cy="133" r="3.2"/><circle cx="192" cy="144" r="2.8"/><circle cx="204" cy="165" r="3.2"/><circle cx="198" cy="191" r="2.8"/><circle cx="179" cy="210" r="3.4"/><circle cx="154" cy="214" r="2.8"/><circle cx="134" cy="199" r="3"/><circle cx="120" cy="177" r="2.8"/><circle cx="151" cy="161" r="2.3"/><circle cx="179" cy="164" r="2.6"/><circle cx="171" cy="190" r="2.6"/><circle cx="147" cy="188" r="2.5"/><circle cx="163" cy="175" r="4"/></g></g>
<text x="292" y="132" fill="#00e5cf" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="4">FEATURED PROJECT</text>
<text x="290" y="190" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" letter-spacing=".3">CRYSTALIZED PARTICLE SPHERE</text>
<text x="292" y="230" fill="#dbe7f7" font-family="Arial,Helvetica,sans-serif" font-size="21">Explore an interactive crystalline sphere made of glowing particles.</text>
