<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07101F"/>
    <stop offset=".55" stop-color="#10152E"/>
    <stop offset="1" stop-color="#071B2C"/>
  </linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C879F5"/>
    <stop offset="1" stop-color="#00B8D9"/>
  </linearGradient>
  <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C879F5"/>
    <stop offset="1" stop-color="#00B8D9"/>
  </linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.5" fill="#C879F5" opacity=".4"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
    <feOffset dy="13"/>
    <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .meta {font:700 17px Arial,sans-serif;letter-spacing:1.1px;fill:#fff}
    .eyebrow {font:700 17px Arial,sans-serif;letter-spacing:3.5px;fill:#C879F5}
    .title {font:800 44px Arial,sans-serif;fill:#fff}
    .desc {font:400 20px Arial,sans-serif;fill:#e7edf8}
    .tech {font:700 15px Arial,sans-serif;fill:#fff;letter-spacing:.8px}
    .button {font:700 16px Arial,sans-serif;fill:#06111f;letter-spacing:1.2px}
    .tagline {font:700 15px Arial,sans-serif;fill:#C879F5;letter-spacing:2.5px}
  </style>
</defs>

<!-- Same dotted neon background and framed tray style -->
<rect width="1000" height="510" rx="26" fill="url(#bg)"/>
<rect width="1000" height="510" rx="26" fill="url(#dots)"/>
<path d="M0 390 Q120 300 260 510 H0Z" fill="#C879F5" opacity=".055"/>
<path d="M760 0 H1000 V175 Q870 130 760 0Z" fill="#00B8D9" opacity=".10"/>

<!-- Card shadow -->
<path d="M100 20 H900 Q935 20 935 55 V425 L895 465 H135 Q100 465 100 430Z"
      fill="#020711" opacity=".9" filter="url(#shadow)"/>

<!-- Main card -->
<path d="M100 12 H900 Q935 12 935 47 V417 L895 457 H135 Q100 457 100 422Z"
      fill="#111B31" stroke="#C879F5" stroke-width="2.5"/>

<!-- Header strip -->
<path d="M100 47 Q100 12 135 12 H900 Q935 12 935 47 V68 H100Z" fill="url(#top)"/>
<text x="140" y="48" class="meta">PROJECT 04</text>
<text x="895" y="48" text-anchor="end" class="meta">ANIKET SAHGAL</text>

<!-- Icon tile -->

        <g transform="translate(166 125)" stroke-linecap="round">
          <rect x="-13" y="-13" width="150" height="150" rx="22" fill="#292448" stroke="#C879F5" stroke-opacity=".24"/>
          <g stroke="#00D9E8" stroke-width="7">
            <path d="M30 10 V115 M75 10 V115 M10 45 H115 M10 90 H115"/>
          </g>
          <circle cx="30" cy="25" r="13" fill="none" stroke="#FF70C8" stroke-width="7"/>
          <path d="M65 65 L87 87 M87 65 L65 87" stroke="#00D9E8" stroke-width="8"/>
          <circle cx="98" cy="105" r="13" fill="none" stroke="#FF70C8" stroke-width="7"/>
        </g>

<!-- Project information -->
<text x="345" y="150" class="eyebrow">FEATURED PROJECT</text>
<text x="345" y="208" class="title">ULTIMATE TIC TAC TOE</text>
<text x="345" y="250" class="desc">Challenge your strategy with an interactive Tic Tac Toe game.</text>

<!-- Identically aligned technology pills -->
<rect x="140" y="315" width="130" height="38" rx="19" fill="#101B31" stroke="#C879F5" stroke-width="1.4"/>
<rect x="290" y="315" width="130" height="38" rx="19" fill="#101B31" stroke="#C879F5" stroke-width="1.4"/>
<rect x="440" y="315" width="175" height="38" rx="19" fill="#101B31" stroke="#C879F5" stroke-width="1.4"/>
<text x="205" y="340" text-anchor="middle" class="tech">HTML5</text>
<text x="355" y="340" text-anchor="middle" class="tech">CSS3</text>
<text x="527" y="340" text-anchor="middle" class="tech">JAVASCRIPT</text>

<!-- Demo button and tagline aligned on one baseline -->
<rect x="140" y="385" width="285" height="54" rx="16" fill="url(#cta)"/>
<text x="282" y="419" text-anchor="middle" class="button">OPEN LIVE DEMO</text>
<text x="895" y="419" text-anchor="end" class="tagline">BUILD • CREATE • INNOVATE</text>
</svg>